[project]
name = "wikidatatextembedding"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "astrapy>=2.2.1",
    "beautifulsoup4>=4.14.3",
    "datasets>=4.4.1",
    "einops>=0.8.2",
    "huggingface-hub>=1.9.2",
    "numpy>=2.4.4",
    "orjson>=3.11.8",
    "python-dotenv>=1.2.3",
    "requests>=2.33.1",
    "sqlalchemy>=2.0.49",
    "torch>=2.11.0",
    "tqdm>=4.67.3",
    "transformers>=5.7.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0"
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes (catches undefined names, unused imports, etc.)
    "I",   # isort (import sorting)
    "D",   # pydocstring (function/class documentation)
]

[tool.ruff.lint.pydocstyle]
convention = "google"
