services:
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
    - .env
    environment:
      # Language selection
      WD_LANG: ${WD_LANG:-en}
      WD_LANGS: ${WD_LANGS:-}
      FALLBACK_LANG: ${FALLBACK_LANG:-en}

      # Wikibase/Textifier connectivity
      WIKIBASE_HOST: ${WIKIBASE_HOST:-wikibase}
      WIKIBASE_PORT: ${WIKIBASE_PORT:-80}
      TEXTIFIER_DB_HOST: ${TEXTIFIER_DB_HOST:-db}
      TEXTIFIER_DB_PORT: ${TEXTIFIER_DB_PORT:-3306}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME_LABEL:-label}
      DB_NAME_WIKI: ${DB_NAME_WIKI:-}
      DB_NAME_LABEL: ${DB_NAME_LABEL:-label}
      DB_USER: ${DB_USER:-}
      DB_PASS: ${DB_PASS:-}

      # Wikibase admin/bootstrap settings
      MW_ADMIN_NAME: ${MW_ADMIN_NAME:-}
      MW_ADMIN_PASS: ${MW_ADMIN_PASS:-}
      MW_ADMIN_EMAIL: ${MW_ADMIN_EMAIL:-}

      # Textifier label cache settings
      LABEL_UNLIMITED: ${LABEL_UNLIMITED:-}
      LABEL_TTL_DAYS: ${LABEL_TTL_DAYS:-}
      LABEL_MAX_ROWS: ${LABEL_MAX_ROWS:-}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-}

      # External API credentials
      JINA_API_KEY: ${JINA_API_KEY:-}
      ASTRA_DB_APPLICATION_TOKEN: ${ASTRA_DB_APPLICATION_TOKEN:-}
      ASTRA_DB_API_ENDPOINT: ${ASTRA_DB_API_ENDPOINT:-}
      ASTRA_DB_DATABASE_ID: ${ASTRA_DB_DATABASE_ID:-}
      ASTRA_DB_KEYSPACE: ${ASTRA_DB_KEYSPACE:-}
      ASTRA_COLLECTION_PREFIX: ${ASTRA_COLLECTION_PREFIX:-}
      WD_HF_TOKEN: ${WD_HF_TOKEN:-}
      WD_HF_REPO_ID: ${WD_HF_REPO_ID:-}
      VECTORS_HF_TOKEN: ${VECTORS_HF_TOKEN:-}
      VECTORS_HF_REPO_ID: ${VECTORS_HF_REPO_ID:-}

      # Pipeline stages
      SAVE_LABELS: ${SAVE_LABELS:-false}
      SAVE_WD_TO_HF: ${SAVE_WD_TO_HF:-false}
      SAVE_TO_VECTORDB: ${SAVE_TO_VECTORDB:-false}
      SAVE_VECTORS_TO_HF: ${SAVE_VECTORS_TO_HF:-false}
      SAVE_SITELINK_VECTORS: ${SAVE_SITELINK_VECTORS:-true}
      SAVE_NOSITELINK_VECTORS: ${SAVE_NOSITELINK_VECTORS:-true}
      DELETE_STALE_VECTORS: ${DELETE_STALE_VECTORS:-false}
      FORCE_DOWNLOAD_DUMP: ${FORCE_DOWNLOAD_DUMP:-false}
      MERGE_HF_TO_MAIN: ${MERGE_HF_TO_MAIN:-false}

      # Dump, batching, and output paths
      DUMP_PATH: ${DUMP_PATH:-data/wd_dump.gz}
      DUMP_DATE: ${DUMP_DATE:-}
      NUM_PROCESSES: ${NUM_PROCESSES:-4}
      READER_QUEUE_SIZE: ${READER_QUEUE_SIZE:-128}
      READER_BATCH_SIZE: ${READER_BATCH_SIZE:-16}
      RUN_STATS_PATH: ${RUN_STATS_PATH:-data/run_stats.json}
      PROPERTY_CONSTRAINT_PIDS: ${PROPERTY_CONSTRAINT_PIDS:-P2302}

      # Hugging Face publishing
      HF_DATA_DIR: ${HF_DATA_DIR:-data}
      HF_CHUNK_SIZE: ${HF_CHUNK_SIZE:-10000}
      HF_BATCH_SIZE: ${HF_BATCH_SIZE:-32}
      HF_QUEUE_SIZE: ${HF_QUEUE_SIZE:-128}
      HF_BRANCH: ${HF_BRANCH:-}
      VECTOR_HF_BRANCH: ${VECTOR_HF_BRANCH:-}
    volumes:
      - ./data:/workspace/data
      - ./WikidataTextifier:/opt/WikidataTextifier:ro
    restart: "no"
    networks:
      - wdtextifier

networks:
  wdtextifier:
    external: true
    name: ${WDTEXTIFIER_COMPOSE_NETWORK:-wikidatatextifier_default}
